[package]
name = "podgate-provider"
description = "Merges the declarations of many sources into one podgate snapshot and pushes it over the admin socket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12.2"
hickory-proto = { version = "0.26.3", features = ["dnssec-ring"] }
hickory-resolver = "0.26.3"
http = "1.5.0"
http-body-util = "0.1"
httparse = "1.10.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "tls12", "rustls-platform-verifier", "ring"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
podgate-model = { version = "0.1.0", path = "../podgate-model" }
podgate-rule = { version = "0.1.0", path = "../podgate-rule" }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
