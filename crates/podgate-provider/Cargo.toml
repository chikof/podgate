[package]
name = "podgate-provider"
description = "Merges the declarations of many sources into one podgate snapshot and pushes it over the admin socket"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
httparse = "1.10.1"
podgate-model = { version = "0.1.0", path = "../podgate-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time", "signal"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
