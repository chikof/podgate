[files]
extend-exclude = ["Cargo.lock", "deny.toml"]

[default.extend-words]
# "`Box::pin`ned" in docs/rust-style.md splits into the token "ned".
ned = "ned"
# `esource` is the name of Pingora's `Error::esource` field (the side an error came from).
esource = "esource"

[default]
# Git and nix revisions such as `958ba64a` split into fake words.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]
