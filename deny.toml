[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates that only pingora 0.9 pulls in; no podgate code uses them and no
# upgrade exists. Drop each line when pingora replaces the crate. Change 0001 Decisions.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono via pingora-core" },
  { id = "RUSTSEC-2024-0388", reason = "derivative via pingora-core, pingora-load-balancing" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via pingora-rustls" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml via pingora-core" },
]

[licenses]
# The allow list covers common permissive licenses before the deps use them; don't warn on unused entries.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  # webpki-root-certs (wasm32 branch of rustls-platform-verifier via instant-acme): Mozilla root data.
  "CDLA-Permissive-2.0",
]

# Workspace crates set `publish = false`, so they are not license-checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal `path` deps carry no version; fine while the crates are `publish = false`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
