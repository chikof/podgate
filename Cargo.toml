[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.99"
# Not published: `cargo deny` treats private crates as licence-exempt.
publish = false

[package]
name = "podgate"
description = "Memory-safe reverse proxy for our PaaS, built on Pingora"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.5"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bcrypt = "0.19.3"
brotli = { version = "3.5.0", default-features = false, features = ["std"] }
bytes = "1.12.2"
cap-std = "4.0.3"
crc32fast = "1.5.5"
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hickory-resolver = "0.26.3"
hmac = "0.13.0"
http = "1.5.0"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "tls12", "rustls-platform-verifier", "ring"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
httpdate = "1.0.3"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "time", "x509-parser", "rcgen"] }
ipnet = "2.12.2"
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
pingora = { version = "0.9", features = ["proxy", "lb", "rustls"] }
pingora-ketama = "0.9"
podgate-model = { version = "0.1.0", path = "crates/podgate-model", features = ["schema"] }
prost = "0.14"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
regex = "1.13.2"
rustix = { version = "1.1.6", features = ["fs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16.0"
ruzstd = "0.9.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.7.1", features = ["request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
wasmtime = { version = "50.0.3", default-features = false, features = ["cranelift", "runtime", "std"] }
x509-parser = { version = "0.18.1", default-features = false }
httparse = "1.10.1"
x509-ocsp = { version = "0.2.1", features = ["std"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
ring = "0.17.14"

[lints]
workspace = true

[dev-dependencies]
# tests/common: raw HTTP/1.1 over TCP and unix sockets, plus a tiny upstream server.
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
h2 = "0.4.20"
wat = "1.263.0"
# libzstd (C) only as the reference decoder in tests: the shipped encoder is ruzstd.
zstd = { version = "0.14.4", default-features = false }
jsonschema = { version = "0.61.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"            # allow per module only with a SAFETY comment and review
missing_docs = "warn"           # public items are documented
unreachable_pub = "warn"        # pub only where the API really exposes it
variant_size_differences = "warn" # enum variants of very different size waste space; box the big one

[workspace.lints.clippy]
# imports
wildcard_imports = "warn"
enum_glob_use = "warn"
# ownership and signatures
borrowed_box = "warn"
ptr_arg = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
# traits
should_implement_trait = "warn"
new_without_default = "warn"
wrong_self_convention = "warn"
len_without_is_empty = "warn"
# errors and panics
unwrap_used = "warn"
unnecessary_unwrap = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"
# API surface
# Application crate: the exhaustive_* rules only matter across team boundaries.
exhaustive_enums = "allow"
exhaustive_structs = "allow"
must_use_candidate = "warn"
# style
needless_for_each = "warn"
# memory layout and niches (docs/rust-style.md `## Memory layout`, clippy.toml sets the thresholds)
large_enum_variant = "warn"
large_futures = "warn"
large_stack_frames = "warn"
large_stack_arrays = "warn"
large_const_arrays = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
needless_pass_by_value = "warn"
box_collection = "warn"
vec_box = "warn"
redundant_allocation = "warn"
boxed_local = "warn"
unnecessary_box_returns = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
option_option = "warn"
ref_option = "warn"
ref_option_ref = "warn"
zero_sized_map_values = "warn"
inefficient_to_string = "warn"
non_zero_suggestions = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Ketama's ring build is nearly all of a hash service's compile time and runs 25 times slower
# unoptimized: with the dev profile's defaults a push of 4 million ring points (the snapshot cap)
# takes about a second, enough for tests running under load to hit the admin request timeout.
[profile.dev.package.pingora-ketama]
opt-level = 3
